targets:
  $default:
    builders:
      # freezed:freezed:
        # generate_for:
        #   include:
        #     - lib/**/model/**.dart
        #     - lib/data/**/model/**.dart
        #     - lib/**/data/model/**.dart
        #     - lib/**/domain/model/**.dart
        #     - lib/resources/**.dart
      json_serializable:
        options:
          # Options configure how source code is generated for every
          # `@JsonSerializable`-annotated class in the package.
          #
          # The default value for each is listed (except explicit_to_json).
          # explicit to json changed from default to true
          any_map: false
          checked: false
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: true
          field_rename: none
          generic_argument_factories: false
          ignore_unannotated: false
          include_if_null: false
      drift_dev:
        options:
          databases:
            app_database: lib\shared\data\drift_sqlite\source\drift_database.dart
          test_dir: test/drift/ # (default)
          schema_dir: drift_schemas/  # (default)

global_options:
  freezed:
    runs_before: 
      - json_serializable
      - riverpod_generator